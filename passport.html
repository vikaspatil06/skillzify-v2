  <style>
    /* Passport proof table: same restrained card language as the rest
       of the site, no new design system. */
    .passport-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .passport-table th, .passport-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--card-border); }
    .passport-table th { color: var(--muted); font-weight: 600; }
    #passport-root details { margin-top: 10px; }
    #passport-root details summary { cursor: pointer; }
    #passport-root details ul { margin: 8px 0 0; padding-left: 20px; }
    /* Passport sheet (redesign v2 rollout): the rendered record sits in
       one framed document sheet — narrower than the site container, with
       a gradient top rule — instead of floating cards on the page. */
    #passport-root { position: relative; max-width: 880px; background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; overflow: hidden; }
    #passport-root::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--gradient); }
    #passport-root > .dash-card { background: var(--bg-soft); }
  </style>
