  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or create your Skillzify account.">
  <title>Login / Register — Skillzify</title>
  <link rel="icon" href="assets/logo-light.png">
  <link rel="stylesheet" href="assets/css/style.css?v=37">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('skillzify_theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
</head>
<body>

<div id="site-nav"></div>
<div class="toast" id="toast" role="status"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="form-card">
        <h1 class="sr-only">Sign in to Skillzify</h1>
        <div class="center" style="margin-bottom:20px">
          <img data-logo src="assets/logo-light.png" alt="Skillzify" style="height:56px">
        </div>
        <div class="auth-tabs" role="tablist">
          <button id="tab-login" class="active" role="tab" aria-selected="true" aria-controls="login-form">Login</button>
          <button id="tab-register" role="tab" aria-selected="false" aria-controls="register-form">Register</button>
        </div>

        <form id="login-form">
          <h2>Welcome back 👋</h2>
          <p class="sub">Log in to personalize your dashboard.</p>
          <div class="form-group">
            <label class="field-lbl" for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="field-lbl" for="login-pass">Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <p class="hint" style="margin:-6px 0 16px;text-align:right"><a href="reset-password.html">Forgot password?</a></p>
          <button class="btn" type="submit" style="width:100%">Login</button>
        </form>

        <form id="register-form" style="display:none">
          <h2>Create account 🚀</h2>
          <p class="sub">Free forever. Start learning in seconds.</p>
          <div class="form-group">
            <label class="field-lbl" for="reg-name">Full name</label>
            <input type="text" id="reg-name" placeholder="Your name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label class="field-lbl" for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="field-lbl" for="reg-pass">Password</label>
            <input type="password" id="reg-pass" placeholder="Min. 6 characters" required autocomplete="new-password">
          </div>
          <button class="btn" type="submit" style="width:100%">Create account</button>
        </form>

        <p class="hint" style="margin-top:18px">🔒 Secured by Firebase Authentication — one account works across devices.</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/nav.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/app.js?v=5"></script>
<script src="assets/js/activity.js?v=11"></script>
<script src="assets/js/palette.js?v=2"></script>

<script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore-compat.js"></script>
<script src="assets/js/auth.js?v=8"></script>
<script src="assets/js/sync.js?v=20"></script>
<script src="assets/js/ai.js?v=22"></script>
</body>
</html>
