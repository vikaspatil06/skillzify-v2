<html lang="en" data-theme="dark">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Skillzify Practice — topic-wise Python exercises with automated tests, hints, and AI tutor.">
  <title>Practice — Skillzify</title>
  <link rel="icon" href="assets/logo-light.png">
  <link rel="stylesheet" href="assets/css/style.css?v=27">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('skillzify_theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
</head>
<body>

<div id="site-nav"></div>
<div class="toast" id="toast" role="status"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <h1 class="section-title">🏋️ Practice</h1>
      <p class="section-sub">Write real code, pass real tests. Hints when you're stuck, an AI tutor when you're lost.</p>
      <div class="card" id="practice-stats-card" style="margin-top:18px"><div class="stats-row" id="practice-stats"></div></div>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container">

      <div id="practice-list">
        <div class="card" id="daily-banner" style="margin-bottom:18px"></div>

        <div class="card" id="drill-card" style="margin-bottom:18px"></div>
        <p class="hint" id="challenge-note" style="display:none;margin-bottom:18px"></p>

        <div class="card" style="margin-bottom:18px">
          <h2 class="section-title" style="font-size:1.3rem">🗺️ Progress by topic</h2>
          <p class="hint">Tap a topic to filter the exercises below.</p>
          <div id="topic-pills" class="pill-row" style="margin:12px 0"></div>
          <div id="topic-progress"></div>
        </div>

        <div class="card" id="revision-sec" style="margin-bottom:18px">
          <h2 class="section-title" style="font-size:1.3rem">🔁 Review queue</h2>
          <p class="hint">Exercises you attempted but haven't cracked yet — spaced repetition in action.</p>
          <div class="grid-3" id="revision-row" style="margin-top:12px"></div>
        </div>

        <div class="filter-bar">
          <select id="filter-diff" aria-label="Filter by difficulty">
            <option value="all">All levels</option>
            <option value="1">★ Easy</option>
            <option value="2">★★ Medium</option>
            <option value="3">★★★ Hard</option>
          </select>
          <input type="text" id="filter-q" placeholder="Search exercises…" aria-label="Search exercises">
          <label class="checkline"><input type="checkbox" id="filter-unsolved"> Unsolved only</label>
        </div>
        <p class="hint" id="ex-count"></p>
        <div class="grid-3" id="ex-grid" style="margin-top:12px"></div>
      </div>

      <div id="practice-detail" style="display:none"></div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/nav.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/app.js?v=5"></script>
<script src="assets/js/activity.js?v=10"></script>
<script src="assets/js/palette.js?v=2"></script>
<script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore-compat.js"></script>
<script src="assets/js/auth.js?v=6"></script>
<script src="assets/js/sync.js?v=16"></script>
<script src="assets/js/ai.js?v=18"></script>
<script src="assets/js/practice-data.js?v=4"></script>
<script src="assets/js/mastery.js?v=4"></script>
<script src="assets/js/practice.js?v=20"></script>
</body>
</html>
