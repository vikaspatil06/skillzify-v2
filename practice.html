  <style>
    /* Practice shell: the Problem of the Day stays full width; below it
       everything flows in ONE column (topics, drill, filters, grid,
       review queue). The drill + review queue used to sit in a slim
       right rail that ended far above the exercise grid, leaving a big
       blank side — Vikas asked for them in the main flow instead
       (16 Nov 2026). */
    .prac-shell { display: grid; gap: 16px; }
    .prac-main { display: grid; gap: 16px; align-content: start; min-width: 0; }
    /* Exercise cards hug their content (card-stretch rule): the shared
       .grid-3 stretches every card to the tallest in its row, which left
       a dead band under the shorter cards' status line. */
    #ex-grid { align-items: start; }

  </style>

<body>

<div id="site-nav"></div>
<div class="toast" id="toast" role="status"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <h1 class="section-title">🏋️ Practice</h1>
      <p class="section-sub">Write real code, pass real tests. Hints when you're stuck, an AI tutor when you're lost.</p>
      <div class="card" id="practice-stats-card" style="margin-top:18px"><div class="stats-row" id="practice-stats"></div></div>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container">

      <div id="practice-list">
        <div class="card potd-card" id="daily-banner" style="margin-bottom:18px"></div>

        <div class="prac-shell">
        <div class="prac-main">
        <div class="card">
          <h2 class="section-title" style="font-size:1.3rem">🗺️ Progress by topic</h2>
          <p class="hint">Tap a topic to filter the exercises below.</p>
          <div id="topic-pills" class="pill-row" style="margin:12px 0"></div>
          <div id="topic-progress"></div>
        </div>

        <div class="card" id="drill-card"></div>
        <p class="hint" id="challenge-note" style="display:none"></p>

        <div class="filter-bar">
          <select id="filter-diff" aria-label="Filter by difficulty">
            <option value="all">All levels</option>
            <option value="1">★ Easy</option>
            <option value="2">★★ Medium</option>
            <option value="3">★★★ Hard</option>
          </select>
          <input type="text" id="filter-q" placeholder="Search exercises…" aria-label="Search exercises">
          <label class="checkline"><input type="checkbox" id="filter-unsolved"> Unsolved only</label>
        </div>
        <p class="hint" id="ex-count"></p>
        <div class="grid-3" id="ex-grid"></div>

        <div class="card" id="revision-sec">
          <h2 class="section-title" style="font-size:1.3rem">🔁 Review queue</h2>
          <p class="hint">Exercises you attempted but haven't cracked yet — spaced repetition in action.</p>
          <div class="grid-3" id="revision-row" style="margin-top:12px"></div>
        </div>
        </div>
        </div>
      </div>

      <div id="practice-detail" style="display:none"></div>

    </div>
  </section>
