plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}
// google-services applied via buildscript classpath (see root build.gradle)
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.skillzify.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.skillzify.app'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.3'
    }

    // Per-ABI APKs (Chaquopy's interpreter is native). arm64 covers virtually
    // all current phones; arm32 is kept for older devices.
    flavorDimensions 'abi'
    productFlavors {
        arm64 {
            dimension 'abi'
            ndk { abiFilters 'arm64-v8a' }
        }
        arm32 {
            dimension 'abi'
            ndk { abiFilters 'armeabi-v7a' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        // Build machine has Python 3.12; skip .pyc pre-compilation of our tiny
        // runner module rather than fight the version check (warns otherwise).
        pyc { src false }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    // Firebase Authentication + Firestore (BoM manages versions)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // await() on Firebase Task objects
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
}
